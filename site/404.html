    @media (prefers-color-scheme: dark) {
      :root { --bg: #0C0B0A; --text: #F4EFE7; --muted: #A69D91; --gold: #D9AE55; --btn: #D9AE55; --btn-text: #0C0B0A; color-scheme: dark; }

    body { display: grid; place-items: center; min-height: 100svh; padding: 32px 16px; background: var(--bg); color: var(--text); font: 500 16px/1.55 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; -webkit-font-smoothing: antialiased; }

    p { margin: 0 0 28px; color: var(--muted); }
